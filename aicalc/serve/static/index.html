<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaizo AI Simulator</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>Kaizo AI Simulator</h1>
  <div class="header-actions">
    <label class="file-btn">Load case JSON<input type="file" id="load-case" accept=".json"></label>
    <button id="export-case">Export case JSON</button>
  </div>
</header>

<!-- Showdown-calc-style results: each side's moves as a joined button stack,
     the selected move's full line + roll list underneath -->
<section id="damage-strip">
  <div class="move-result-subgroup">
    <div class="result-header">Your Pokémon's moves <span class="dim">(select one for details)</span></div>
    <div id="dmg-player" class="res-stack"></div>
  </div>
  <div class="move-result-subgroup right">
    <div class="result-header">AI Pokémon's moves</div>
    <div id="dmg-ai" class="res-stack"></div>
  </div>
</section>
<div id="main-result">
  <div id="main-result-text" class="big-text">Set both Pokémon to see damage.</div>
  <details id="dmg-details"><summary>Possible damage amounts</summary>
    <div id="dmg-rolls"></div>
  </details>
</div>

<main>
  <!-- Player: left -->
  <section class="column" id="player-col">
    <h2>Your Pokémon</h2>
    <div id="player-panel"></div>
  </section>

  <!-- Field + side conditions + results: middle -->
  <section class="column" id="mid-col">
    <h2>Field</h2>
    <div id="field-controls"></div>
    <div id="side-conditions"></div>
    <h2>AI move probabilities</h2>
    <div id="prob-panel"><p class="placeholder">Pick a trainer Pokémon and set yours.</p></div>
    <div id="error-panel"></div>
    <details><summary>Raw battle JSON</summary>
      <textarea id="raw-json" rows="14" spellcheck="false"></textarea>
      <button id="apply-raw">Apply raw JSON</button>
    </details>
  </section>

  <!-- AI opponent: right -->
  <section class="column" id="ai-col">
    <h2>AI Pokémon (opponent)</h2>
    <div class="row">
      <input id="trainer-search" list="trainer-list" placeholder="Search trainer…">
      <datalist id="trainer-list"></datalist>
    </div>
    <div id="trainer-party" class="party-strip"></div>
    <div id="ai-flags" class="flag-row"></div>
    <div id="ai-panel"></div>
  </section>
</main>

<datalist id="species-list"></datalist>
<datalist id="move-list"></datalist>
<script src="/app.js"></script>
</body>
</html>
